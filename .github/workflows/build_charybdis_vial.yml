name: Build Charybdis 4x6 Vial
on:
  workflow_dispatch:
    inputs:
      keymap:
        description: 'Keymap name (vial / default)'
        required: true
        default: 'vial'

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          repository: KSP-Hub/vial-qmk
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          clean: true
          set-safe-directory: true

      - name: Verify keymap exists
        run: |
          KEYMAP_DIR="keyboards/bastardkb/charybdis/4x6/keymaps/${{ github.event.inputs.keymap }}"
          if [ ! -d "$KEYMAP_DIR" ]; then
            echo "❌ Keymap '${{ github.event.inputs.keymap }}' not found in $KEYMAP_DIR"
            echo "📂 Available keymaps:"
            ls -1 keyboards/bastardkb/charybdis/4x6/keymaps/
            exit 1
          fi
          echo "✅ Keymap found: $KEYMAP_DIR"

      - name: Compile Firmware
        shell: bash
        run: |
          echo "🔨 Building: bastardkb/charybdis/4x6/v2/splinky_2:${{ github.event.inputs.keymap }}"
          make bastardkb/charybdis/4x6/v2/splinky_2:${{ github.event.inputs.keymap }} -j$(nproc)

      - name: List build directory contents
        if: always()
        run: |
          echo "📦 Contents of .build/:"
          ls -la .build/ || echo "⚠️ .build directory does not exist."

      - name: Upload UF2 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: charybdis-4x6-${{ github.event.inputs.keymap }}-uf2
          path: .build/*.uf2
          retention-days: 7
          if-no-files-found: error
