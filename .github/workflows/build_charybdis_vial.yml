name: Build Charybdis 4x6 Vial
on:
  workflow_dispatch:
    inputs:
      keymap:
        description: 'Keymap name (vial / default / wellum)'
        required: true
        default: 'vial'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          repository: KSP-Hub/vial-qmk
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          clean: true
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QMK CLI
        run: |
          python3 -m pip install --upgrade pip
          pip install qmk
          qmk setup -y

      - name: Verify keymap exists
        run: |
          KEYMAP_DIR="keyboards/bastardkb/charybdis/4x6/keymaps/${{ github.event.inputs.keymap }}"
          if [ ! -d "$KEYMAP_DIR" ]; then
            echo "❌ Keymap '${{ github.event.inputs.keymap }}' not found in $KEYMAP_DIR"
            echo "📂 Available keymaps:"
            ls -1 keyboards/bastardkb/charybdis/4x6/keymaps/
            exit 1
          fi
          echo "✅ Keymap found: $KEYMAP_DIR"

      - name: Compile Firmware
        run: |
          echo "🔨 Building: bastardkb/charybdis/4x6/v2/splinky_2:${{ github.event.inputs.keymap }}"
          qmk compile -kb bastardkb/charybdis/4x6/v2/splinky_2 -km ${{ github.event.inputs.keymap }} -j $(nproc)

      - name: Upload UF2 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: charybdis-4x6-${{ github.event.inputs.keymap }}-uf2
          path: .build/*.uf2
          retention-days: 7
          if-no-files-found: error
